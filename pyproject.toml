[project]
name = "order-service"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "pytest>=8.2.0",
  "httpx>=0.27.0",
  "ruff>=0.5.0",
  "fastapi>=0.111.0",
  "uvicorn>=0.30.0",
  "sqlalchemy[asyncio]>=2.0.47",
  "asyncpg>=0.31.0",
]

[tool.uv]

[tool.uv.sources]
order-service = { workspace = true }

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
addopts = "-q"

[dependency-groups]
dev = [
    "order-service",
]
